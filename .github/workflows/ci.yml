# CI: bun run check with every runtime toolchain present (Go for templ, PHP 8.4 + composer for Twig, Python 3.13 for Jinja2, PHP for Latte).
# UI8KIT_REQUIRE_ALL_RUNTIMES=1 turns a skipped runtime group into a failure, so the static runtimes always run here.
name: ci

# Manual only: run it from the Actions tab (Run workflow).
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UI8KIT_REQUIRE_ALL_RUNTIMES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/kit-compose/templ/go.mod
          cache: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring
          tools: composer:v2
          coverage: none
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: toolchains
        run: bun --version && go version && php --version && composer --version && python3 --version
      - run: bun install --frozen-lockfile
      - name: server runtimes of the kit-compose tests (Twig + Latte via composer, Jinja2 in a venv)
        run: |
          composer install -d packages/kit-compose/test/server --no-interaction --no-progress
          python3 -m venv packages/kit-compose/test/server/.venv
          packages/kit-compose/test/server/.venv/bin/pip install -r packages/kit-compose/test/server/requirements.txt
      - run: bun run check
      - run: bun run codex:validate
      - run: bun run typecheck
      - run: bun run test
